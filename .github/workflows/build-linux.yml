name: Build Linux (PR)

on:
  pull_request:
    paths-ignore:
      - "apps/website/**"
      - "**.md"
      - ".github/workflows/release-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libxcb-dri3-0

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-linux-pr-${{ github.run_number }}
          path: |
            release/Forge-*.AppImage
            release/Forge-*.deb
          retention-days: 14
          if-no-files-found: error
