appId: app.phumi.forge
productName: Forge
copyright: Copyright © 2026 Phumi
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - "!src/**/*"
  - "!packages/**/*"
  - "!scripts/**/*"
  - "!dist/**/*"
  - "!electron.vite.config.ts"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,components.json}"
  - "!README.md"
  - "!node_modules/monaco-editor/**/*"
  - "!node_modules/@monaco-editor/**/*"
  - "!node_modules/playwright-core/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/lucide-react/**/*"
  - "!node_modules/@xterm/**/*"
  - "!node_modules/react-resizable-panels/**/*"
  - "!node_modules/@radix-ui/**/*"
  - "!node_modules/class-variance-authority/**/*"
  - "!node_modules/clsx/**/*"
  - "!node_modules/tailwind-merge/**/*"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
npmRebuild: false
electronLanguages:
  - en-US
win:
  executableName: Forge
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Forge
  uninstallDisplayName: Forge
  artifactName: Forge-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
mac:
  executableName: Forge
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: Forge-${version}.${ext}
  # Unsigned/ad-hoc builds for beta distribution. See README for signed/notarized setup.
  gatekeeperAssess: false
  hardenedRuntime: false
linux:
  executableName: forge
  icon: build/icon.png
  category: Development
  maintainer: Phumi
  synopsis: AI coding workspace
  description: Forge — Ask, code, run, inspect, and commit in one desktop workspace.
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Forge-${version}.${ext}
